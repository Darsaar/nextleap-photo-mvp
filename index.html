<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Memory Match</title>
<meta name="description" content="Find a photo by describing it in your own words. A Google Photos concept demo on a fictional sample library.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,400,0..1,0&display=block" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<header class="appbar">
  <button class="icon-btn" id="menuBtn" aria-label="Menu"><span class="ms">menu</span></button>
  <a class="logo" href="#" id="logo"><span class="ms fill logo-ic">photo_library</span><span class="word">Photos</span><span class="concept">Concept</span></a>
  <form class="searchpill" id="form" autocomplete="off">
    <span class="ms">search</span>
    <input id="q" placeholder="Search photos or collections, like “Goa trip sunset”" aria-label="Search photos or collections">
    <button type="button" class="icon-btn small" id="clearQ" aria-label="Clear"><span class="ms">close</span></button>
    <button type="button" class="icon-btn small fbtn" id="filterBtn" aria-label="Filters" title="Filters"><span class="ms">tune</span><span class="fbadge hidden" id="fbadge"></span></button>
    <div class="suggest hidden" id="suggest"></div>
    <div class="fpanel hidden" id="fpanel"></div>
  </form>
  <div class="appbar-right">
    <div class="avatar" title="Aarav (fictional)">A</div>
  </div>
</header>

<div class="shell">
  <nav class="rail" id="rail">
    <a class="navi active" data-nav="photos" href="#"><span class="ms">photo</span>Photos</a>
    <a class="navi" data-nav="collections" href="#"><span class="ms">photo_album</span>Collections</a>
    <a class="navi" data-nav="search" href="#"><span class="ms">search</span>Search</a>
    <p class="rail-h">Demo</p>
    <a class="navi" data-nav="tasks" href="#"><span class="ms">checklist</span>Test tasks</a>
    <a class="navi" data-nav="compare" href="#"><span class="ms">compare_arrows</span>Compare with today</a>
    <a class="navi" data-nav="credits" href="#"><span class="ms">copyright</span>Photo credits</a>
    <div class="rail-note">
      <span class="tagwarn">Sample library · fictional</span>
      <p id="libcount"></p>
      <p>Concept demo for a NextLeap PM case. Not a Google product.</p>
    </div>
  </nav>

  <main class="main" id="main">
    <!-- Photos timeline -->
    <section id="home">
      <div class="home-head"><h1>Photos</h1></div>
      <div id="timeline"></div>
    </section>

    <!-- Collections -->
    <section id="collections" class="hidden">
      <div class="home-head"><h1>Collections</h1></div>
      <div id="colBody"></div>
    </section>

    <!-- Search results -->
    <section id="results" class="hidden">
      <div class="res-head">
        <button class="icon-btn" id="backBtn" aria-label="Back"><span class="ms">arrow_back</span></button>
        <h1 id="resTitle"></h1>
      </div>
      <p class="tasknote hidden" id="taskNote"></p>
      <p class="scopechip hidden" id="scopeChip"></p>
      <div class="banner hidden" id="nofit"></div>
      <div class="grid" id="grid"></div>
      <div class="tl hidden" id="scopeAll"></div>
      <div class="card followup hidden" id="step4">
        <span class="ms fill fu-ic">help</span>
        <div>
          <p class="fu-q" id="fuQ"></p>
          <div class="chips" id="fuOpts"></div>
        </div>
      </div>
    </section>
  </main>
</div>

<!-- photo viewer -->
<div class="viewer hidden" id="viewer" role="dialog" aria-modal="true">
  <div class="v-stage">
    <div class="v-bar">
      <button class="icon-btn dark" id="vBack" aria-label="Close"><span class="ms">arrow_back</span></button>
      <span class="v-spacer"></span>
      <button class="found hidden" id="foundBtn"><span class="ms">check_circle</span>This is the one</button>
      <button class="icon-btn dark" id="vInfo" aria-label="Info"><span class="ms">info</span></button>
    </div>
    <img id="vImg" alt="">
    <div class="v-toast hidden" id="foundNote"></div>
  </div>
  <aside class="v-info" id="vPanel"></aside>
</div>

<!-- dialogs -->
<div class="scrim hidden" id="scrim">
  <div class="dialog" id="dialog" role="dialog" aria-modal="true">
    <button class="icon-btn d-close" id="dClose" aria-label="Close"><span class="ms">close</span></button>
    <div id="dBody"></div>
  </div>
</div>

<script type="module" src="app.js"></script>
</body>
</html>
